; Optional: build with PlatformIO instead of the Arduino IDE.
;   cd firmware && pio run -t upload && pio device monitor

[platformio]
src_dir = co2_monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sensirion/Sensirion I2C SCD4x@^0.4.0
    sensirion/Sensirion Core
    ademuri/twilio-esp32-client
    me-no-dev/AsyncTCP
    me-no-dev/ESP Async WebServer
